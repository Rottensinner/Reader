<!doctype html>
<html lang="pl" data-theme="night">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#171a19"><title>BookForge — Czytnik</title><link rel="stylesheet" href="styles.css"></head>
<body>
<a class="skip" href="#reader">Przejdź do tekstu</a>
<header class="topbar"><a class="brand" href="./">B<span>F</span><small>BOOKFORGE / READER</small></a><div class="tools"><button id="import">Wczytaj książkę</button><button id="settings-toggle" aria-expanded="false" aria-controls="settings">Aa <span class="hide-small">Wygląd</span></button><button id="toc-toggle" aria-expanded="false" aria-controls="sidebar">☰ <span class="hide-small">Rozdziały</span></button></div></header>
<div class="layout"><aside id="sidebar"><div class="eyebrow">TWOJA KSIĄŻKA</div><h1 id="book-title"></h1><p id="book-subtitle" class="muted"></p><div class="divider"></div><div class="side-heading">SPIS TREŚCI <span id="chapter-count"></span></div><nav id="toc" aria-label="Rozdziały"></nav><div class="divider"></div><div class="side-heading">ZAKŁADKI</div><div id="bookmarks"></div><p class="side-note">Miejsce czytania zapisuje się automatycznie na tym urządzeniu.</p></aside>
<main id="reader" tabindex="-1"><div class="reading-head"><span id="chapter-label" class="eyebrow"></span><span id="time" class="muted"></span></div><article><p id="chapter-kicker" class="eyebrow"></p><h2 id="chapter-title"></h2><p id="chapter-meta" class="muted"></p><div id="content"></div></article><div class="chapter-actions"><button id="prev">← Poprzedni</button><button id="bookmark">＋ Zakładka</button><button id="next">Następny →</button></div><div class="end-note">BOOKFORGE · CZYTAJ WE WŁASNYM TEMPIE</div></main></div>
<footer class="status"><span id="status-label"></span><progress id="progress" max="100" value="0" aria-label="Postęp rozdziału"></progress><span id="percentage">0%</span></footer>
<dialog id="settings"><div class="dialog-head"><h2>Tak, jak lubisz czytać</h2><button id="settings-close" aria-label="Zamknij ustawienia">✕</button></div><p class="muted">Ustawienia zostaną zapamiętane.</p><label>Wielkość tekstu <output id="font-value"></output><input id="font-size" type="range" min="16" max="30" step="1"></label><label>Interlinia<input id="line-height" type="range" min="1.4" max="2.2" step="0.1"></label><label>Szerokość kolumny<input id="column-width" type="range" min="480" max="900" step="20"></label><label>Krój pisma<select id="font-family"><option value="serif">Literacki — szeryfowy</option><option value="sans">Prosty — bezszeryfowy</option></select></label><fieldset><legend>Kolor strony</legend><div class="themes"><button data-theme="night">Noc</button><button data-theme="paper">Papier</button><button data-theme="sepia">Sepia</button></div></fieldset></dialog>
<input id="file" type="file" accept=".json,.txt" hidden><input id="images" type="file" accept="image/*" multiple hidden><div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body></html>
